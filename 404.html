<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Malak Serag</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" />
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
  .lost code { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .lost h1 { margin: 18px 0 16px; font-size: clamp(3rem, 10vw, 6rem); }
  .lost p { color: var(--ink-2); max-width: 44ch; margin: 0 auto 30px; }
</style>
</head>
<body>
<main class="lost">
  <div>
    <code>0x194 · address not mapped</code>
    <h1>Nothing lives at this <em>address.</em></h1>
    <p>The page you asked for isn't in memory. The portfolio is, though.</p>
    <a class="btn btn-solid" href="/">Back to the portfolio</a>
  </div>
</main>
</body>
</html>
